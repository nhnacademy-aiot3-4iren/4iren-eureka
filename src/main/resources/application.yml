spring:
  application:
    name: 4iren-eureka

# 이중화 설정
eureka:
  client:
    # 서로 등록하도록 설정
    register-with-eureka: true
    # 서로 동기화하도록 설정
    fetch-registry: true
  instance:
    prefer-ip-address: true

# 관리 엔드포인트 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus