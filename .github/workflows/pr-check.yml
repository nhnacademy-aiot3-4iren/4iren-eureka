name: PR Code Quality Check & Telegram Notification

# 스크립트 실행 시기
on:
  pull_request:
    # pr 생성, pr 업데이트(코드 변경), 리뷰어 지정 시 발생
    types: [opened, synchronize, review_requested]
    # develop이나 main에 pr을 하려고 할때
    branches: [ "main", "develop" ]

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram으로 PR 알림 보내기
        # PR을 처음 생성하거나 리뷰어를 지정했을 때만 텔레그램 알림 전송
        if: github.event.action == 'opened' || github.event.action == 'review_requested'
        uses: F2had/pr-telegram-action@v1.0.0
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 코드 가져오기
        uses: actions/checkout@v3
        with:
          # 깃 히스토리 가져오기
          fetch-depth: 0

      - name: JDK 21 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven 실행 권한 부여
        run: chmod +x ./mvnw

      - name: 코드 컴파일 및 빌드 검사 (커버리지 리포트 생성)
        # mvn clean verify를 실행해 .xml 리포트 만들기
        run: ./mvnw clean verify

      # ==========================================
      # develop, main에 따라 분기
      # ==========================================

      - name: 소나큐브 분석 (Develop 브랜치 - 통과 허용)
        if: github.base_ref == 'develop'
        run: >
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectKey=4iren-eureka

      - name: 소나큐브 분석 (Main 브랜치 - 커버리지 미달 시 차단)
        if: github.base_ref == 'main'
        run: >
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectKey=4iren-eureka
          -Dsonar.qualitygate.wait=true

      # ==========================================
      # pr 화면에 소나큐브 리포트 링크 댓글 달기
      # ==========================================
      - name: PR에 소나큐브 링크 댓글 작성
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() # 성공하든 실패하든 무조건 댓글 달기
        with:
          header: sonarqube-report
          message: |
            ### 🔍 SonarQube 분석 완료!
            - 타깃 브랜치: `${{ github.base_ref }}`
            - 분석 결과: `${{ job.status }}`

            📊 [**👉 소나큐브 상세 리포트 확인하러 가기**](${{ secrets.SONAR_HOST_URL }}/dashboard?id=4iren-eureka&codeScope=overall)